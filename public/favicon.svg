<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- "Angle of pursuit": a heading ray and a line-of-sight ray share a
       vertex; the target is the dot at the end of the line of sight. -->
  <g fill="none" stroke="#000" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 102 H106" />
    <path d="M26 102 L88 32" />
  </g>
  <circle cx="88" cy="32" r="15" fill="#000" />
  <style>
    path { stroke: #000; }
    circle { fill: #000; }
    @media (prefers-color-scheme: dark) {
      path { stroke: #FFF; }
      circle { fill: #FFF; }
    }
  </style>
</svg>
